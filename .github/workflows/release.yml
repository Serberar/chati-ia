# Compila el instalador en GitHub, no en un ordenador personal.
#  - En un pull request que lo toque: lo deja como artefacto, para probarlo.
#  - Al subir una etiqueta vX.Y.Z: ademas crea la release en BORRADOR, con su huella SHA-256.
# Nadie la recibe hasta que el borrador se publica a mano.
name: Instalador

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["setup/**", ".github/workflows/release.yml", "orchestrator/desktop_app.py"]

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.lock.txt

      - name: La etiqueta coincide con version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path orchestrator\version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "La etiqueta $env:TAG no es la version de version.py ($version)" }

      - name: Preparar
        shell: powershell
        run: |
          python -m venv orchestrator\venv
          orchestrator\venv\Scripts\python.exe -m pip install -r orchestrator\requirements.lock.txt pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw "pip fallo" }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Antes que las pruebas: asi el instalador sale de la carpeta recien descargada.
      - name: Compilar
        shell: powershell
        run: .\setup\build_release.ps1

      - name: Pruebas
        working-directory: orchestrator
        run: venv\Scripts\python.exe -m pytest -q -m "not live and not slow"

      - name: Huella SHA-256
        shell: powershell
        run: |
          $exe = "setup\Output\ChatiIA-Instalador.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$exe.sha256" -Value "$hash  ChatiIA-Instalador.exe" -Encoding ascii
          "SHA-256: $hash" | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ChatiIA-Instalador
          path: setup/Output/ChatiIA-Instalador.exe*
          if-no-files-found: error
          retention-days: 14

  borrador:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write  # crear la release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ChatiIA-Instalador
          path: salida
      - name: Crear la release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" salida/ChatiIA-Instalador.exe salida/ChatiIA-Instalador.exe.sha256 --draft --title "Chati IA $TAG" --notes-file .github/notas_release.md
