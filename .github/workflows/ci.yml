name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: orchestrator
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: ruff check . --select F,E9
      - run: python -m pytest -q -m "not live and not slow"
